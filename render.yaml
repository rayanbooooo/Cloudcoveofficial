# Render Blueprint for Scalp City (scalp-city/). Creates one always-on Docker
# web service and one PostgreSQL database. See scalp-city/GO_LIVE.md.
#
# Written to Render's documented Blueprint format (render.com/docs/blueprint-spec)
# but not validated against Render from the environment it was written in:
# if Render reports a field or plan name as invalid, pick the equivalent in the
# dashboard (web: always-on "Starter" or above; database: a paid plan — free
# Render databases expire).
#
# Keep EXACTLY ONE instance. Scalp City refuses to let two instances trade the
# same account (the second waits in standby), but never scale it out.
services:
  - type: web
    name: scalp-city
    runtime: docker
    rootDir: scalp-city
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Change to main once this branch is merged.
    branch: claude/zen-franklin-lzwngb
    region: virginia # US East: close to Alpaca; OANDA's servers are reachable from it as well
    plan: starter # always on; free instances sleep, which a trading bot cannot do
    numInstances: 1
    healthCheckPath: /api/healthz
    # Deploy by hand, outside market hours: a deploy restarts the trader.
    autoDeploy: false
    envVars:
      # Which broker trades: oanda = gold, Nasdaq 100, GBP/USD, EUR/JPY, US30 (CFDs/FX);
      # alpaca = US stocks and options. Alpaca cannot trade the markets above.
      - key: BROKER
        value: oanda
      # Start in PAPER (= OANDA fxTrade PRACTICE). Switching to LIVE happens later,
      # deliberately (GO_LIVE.md).
      - key: TRADING_ENVIRONMENT
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      # OANDA secrets: set in the Render dashboard, never in git or in chat.
      # Leave the LIVE pair empty until you are ready for real money.
      - key: OANDA_PRACTICE_TOKEN
        sync: false
      - key: OANDA_PRACTICE_ACCOUNT_ID
        sync: false
      - key: OANDA_LIVE_TOKEN
        sync: false
      - key: OANDA_LIVE_ACCOUNT_ID
        sync: false
      # The window (New York time) in which workers may open new positions.
      - key: OANDA_SESSION
        value: "09:30-16:00"
      # Deliberately small starting limits for OANDA, in your account currency. They seed
      # the risk settings on first boot; raise them in the app (Risk drawer) once results
      # justify it. These are the limits that apply to OANDA; the Alpaca MAX_* block
      # further down does not (it is share/option sized and would block every CFD order).
      - key: OANDA_MAX_DAILY_LOSS
        value: "100"
      - key: OANDA_MAX_RISK_PER_TRADE
        value: "20"
      - key: OANDA_MAX_POSITION_NOTIONAL
        value: "10000"
      - key: OANDA_MAX_CONCURRENT_POSITIONS
        value: "3"
      - key: OANDA_MAX_TRADES_PER_DAY
        value: "10"
      # Alpaca secrets (only used when BROKER=alpaca). Render asks for these when you
      # create the Blueprint; they stay empty if you only use OANDA.
      - key: ALPACA_PAPER_API_KEY
        sync: false
      - key: ALPACA_PAPER_API_SECRET
        sync: false
      - key: ALPACA_LIVE_API_KEY
        sync: false
      - key: ALPACA_LIVE_API_SECRET
        sync: false
      # Market data: what your Alpaca plan includes. Live OPTIONS autotrading
      # needs real-time OPRA (paid) — set ALPACA_OPTIONS_FEED=opra once subscribed.
      - key: ALPACA_STOCK_FEED
        value: iex
      - key: ALPACA_OPTIONS_FEED
        value: indicative
      # Paper only (ignored in live): lets workers paper-trade options on the free feed.
      - key: PAPER_ALLOW_INDICATIVE_OPTIONS
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scalp-city-db
          property: connectionString
      # Deliberately small starting limits for ALPACA (BROKER=alpaca). They seed the
      # risk settings on first boot; raise them later in the app (Risk drawer).
      - key: MAX_DAILY_LOSS
        value: "100"
      - key: MAX_POSITION_SIZE
        value: "300"
      - key: MAX_ORDER_NOTIONAL
        value: "300"
      - key: MAX_CONTRACTS
        value: "1"
      - key: MAX_SHARES
        value: "10"
      - key: MAX_CONCURRENT_POSITIONS
        value: "1"
      - key: MAX_TRADES_PER_DAY
        value: "3"

databases:
  - name: scalp-city-db
    databaseName: scalp_city
    user: scalp
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: [] # no outside access; only the web service connects
