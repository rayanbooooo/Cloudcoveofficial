# Render Blueprint for Scalp City (scalp-city/). Creates one always-on Docker
# web service and one PostgreSQL database. See scalp-city/GO_LIVE.md.
#
# Written to Render's documented Blueprint format (render.com/docs/blueprint-spec)
# but not validated against Render from the environment it was written in:
# if Render reports a field or plan name as invalid, pick the equivalent in the
# dashboard (web: always-on "Starter" or above; database: a paid plan — free
# Render databases expire).
#
# Keep EXACTLY ONE instance. Scalp City refuses to let two instances trade the
# same account (the second waits in standby), but never scale it out.
services:
  - type: web
    name: scalp-city
    runtime: docker
    rootDir: scalp-city
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Change to main once this branch is merged.
    branch: claude/zen-franklin-lzwngb
    region: virginia # US East: close to Alpaca and OANDA's servers
    plan: starter # always on; free instances sleep, which a trading bot cannot do
    numInstances: 1
    healthCheckPath: /api/healthz
    # Deploy by hand, outside market hours: a deploy restarts the trader.
    autoDeploy: false
    envVars:
      # Which broker trades. oanda = gold, Nasdaq 100, GBP/USD, EUR/JPY and US30 on an OANDA account
      # (CFDs/FX, nearly 24 hours on weekdays). alpaca = shares of the ETF stand-ins (GLD, QQQ, DIA,
      # FXB, FXE), US stock hours only; its settings further down stay in place but are unused.
      - key: BROKER
        value: oanda
      # Start in PAPER (= OANDA fxTrade PRACTICE). Switching to LIVE happens later, deliberately (GO_LIVE.md).
      - key: TRADING_ENVIRONMENT
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      # OANDA secrets: Render asks for these. They live only in Render's environment, never in git or in chat.
      # Leave the LIVE pair empty until you are ready for real money.
      - key: OANDA_PRACTICE_TOKEN
        sync: false
      - key: OANDA_PRACTICE_ACCOUNT_ID
        sync: false
      - key: OANDA_LIVE_TOKEN
        sync: false
      - key: OANDA_LIVE_ACCOUNT_ID
        sync: false
      # When workers may open positions, New York time, weekdays: 00:00-16:30 is 06:00-22:30 in
      # Amsterdam. It ends before OANDA's 17:00 New York rollover and weekly close, so nothing is carried
      # through either. 00:00-23:59 would trade through the evening too (wider spreads at rollover).
      - key: OANDA_SESSION
        value: "00:00-16:30"
      - key: OANDA_SKIP_US_HOLIDAYS
        value: "false"
      # Deliberately small starting limits for OANDA, in your account currency. They seed the risk
      # settings on first boot; raise them in the app (Risk drawer) once results justify it. The Alpaca
      # MAX_* block further down does not apply to OANDA.
      - key: OANDA_MAX_DAILY_LOSS
        value: "100"
      - key: OANDA_MAX_RISK_PER_TRADE
        value: "20"
      - key: OANDA_MAX_POSITION_NOTIONAL
        value: "10000"
      - key: OANDA_MAX_CONCURRENT_POSITIONS
        value: "3"
      - key: OANDA_MAX_TRADES_PER_DAY
        value: "10"
      # Alpaca secrets (only used when BROKER=alpaca). They live only in Render's environment.
      - key: ALPACA_PAPER_API_KEY
        sync: false
      - key: ALPACA_PAPER_API_SECRET
        sync: false
      - key: ALPACA_LIVE_API_KEY
        sync: false
      - key: ALPACA_LIVE_API_SECRET
        sync: false
      # Market data: what your Alpaca plan includes. Live OPTIONS autotrading
      # needs real-time OPRA (paid) — set ALPACA_OPTIONS_FEED=opra once subscribed.
      - key: ALPACA_STOCK_FEED
        value: iex
      - key: ALPACA_OPTIONS_FEED
        value: indicative
      # Paper only (ignored in live): lets workers paper-trade options on the free feed.
      - key: PAPER_ALLOW_INDICATIVE_OPTIONS
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scalp-city-db
          property: connectionString
      # Which Alpaca workers run: etf = shares of GLD (gold), QQQ (Nasdaq), DIA (US30), FXB (GBPUSD)
      # and FXE (euro); options = the original QQQ/SPY/IWM options workers.
      - key: ALPACA_WORKER_SET
        value: etf
      # Deliberately small starting limits. They seed the risk settings on FIRST boot only; after
      # that the app's Risk drawer is the source of truth (an existing deployment keeps what it
      # stored, so raise "position size" there if share entries report that one share is over the limit).
      # Position size must cover at least one share: QQQ costs several hundred dollars.
      - key: MAX_DAILY_LOSS
        value: "100"
      - key: MAX_POSITION_SIZE
        value: "1000"
      - key: MAX_ORDER_NOTIONAL
        value: "1000"
      - key: MAX_CONTRACTS
        value: "1"
      - key: MAX_SHARES
        value: "50"
      - key: MAX_CONCURRENT_POSITIONS
        value: "2"
      - key: MAX_TRADES_PER_DAY
        value: "6"

databases:
  - name: scalp-city-db
    databaseName: scalp_city
    user: scalp
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: [] # no outside access; only the web service connects
