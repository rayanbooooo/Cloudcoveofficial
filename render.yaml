# Render Blueprint for Scalp City (scalp-city/). Creates one always-on Docker
# web service and one PostgreSQL database. See scalp-city/GO_LIVE.md.
#
# Written to Render's documented Blueprint format (render.com/docs/blueprint-spec)
# but not validated against Render from the environment it was written in:
# if Render reports a field or plan name as invalid, pick the equivalent in the
# dashboard (web: always-on "Starter" or above; database: a paid plan — free
# Render databases expire).
#
# Keep EXACTLY ONE instance. Scalp City refuses to let two instances trade the
# same account (the second waits in standby), but never scale it out.
services:
  - type: web
    name: scalp-city
    runtime: docker
    rootDir: scalp-city
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Change to main once this branch is merged.
    branch: claude/zen-franklin-lzwngb
    region: virginia # US East: close to Alpaca
    plan: starter # always on; free instances sleep, which a trading bot cannot do
    numInstances: 1
    healthCheckPath: /api/healthz
    # Deploy by hand, outside market hours: a deploy restarts the trader.
    autoDeploy: false
    envVars:
      # Which broker trades. alpaca = shares of the ETF stand-ins (GLD, QQQ, DIA, FXB, FXE), US stock hours
      # only (the default here). oanda = the real gold/Nasdaq/FX markets, nearly 24 hours, but OANDA does
      # not offer its API to EU clients (OANDA TMS / OANDA Europe), so it only suits accounts outside the EU.
      # To use it, add its env vars by hand in Render (GO_LIVE.md, Part A).
      - key: BROKER
        value: alpaca
      # Start in PAPER. Switching to LIVE happens later, deliberately (GO_LIVE.md).
      - key: TRADING_ENVIRONMENT
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      # Alpaca secrets: Render asks for these when you create the Blueprint. They live only
      # in Render's environment, never in git or in chat.
      - key: ALPACA_PAPER_API_KEY
        sync: false
      - key: ALPACA_PAPER_API_SECRET
        sync: false
      - key: ALPACA_LIVE_API_KEY
        sync: false
      - key: ALPACA_LIVE_API_SECRET
        sync: false
      # Market data: what your Alpaca plan includes. Live OPTIONS autotrading
      # needs real-time OPRA (paid) — set ALPACA_OPTIONS_FEED=opra once subscribed.
      - key: ALPACA_STOCK_FEED
        value: iex
      - key: ALPACA_OPTIONS_FEED
        value: indicative
      # Paper only (ignored in live): lets workers paper-trade options on the free feed.
      - key: PAPER_ALLOW_INDICATIVE_OPTIONS
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scalp-city-db
          property: connectionString
      # Which Alpaca workers run: scalp = fast 1-minute scalpers on GLD (gold), QQQ (Nasdaq), DIA (US30), FXB
      # (GBPUSD) and FXE (euro), long and short, many trades an hour; etf = the same markets with a patient
      # strategy that trades rarely; options = the original QQQ/SPY/IWM options workers.
      - key: ALPACA_WORKER_SET
        value: scalp
      # Which sessions the scalpers trade (New York time): regular = 09:30-16:00; extended = 04:00-20:00; all =
      # Sunday 20:00 to Friday 20:00 without a break, including the overnight session. Outside 09:30-16:00 Alpaca
      # takes limit orders only (the app prices exits as marketable limits). A worker only enters on a FRESH price,
      # and the data plan decides where one exists: the free IEX feed (ALPACA_STOCK_FEED=iex) reports only
      # 08:00-17:00 New York, and its overnight feed delivers trades 15 minutes late, so on the free plan this
      # setting adds only the IEX pre-open and post-close hours. 04:00-20:00 needs SIP (ALPACA_STOCK_FEED=sip) and
      # the night needs BOATS, both Alpaca's paid data plan. See README, "Trading every session".
      - key: ALPACA_SESSIONS
        value: all
      # Deliberately small starting limits. They seed the risk settings on FIRST boot only; after
      # that the app's Risk drawer is the source of truth (an existing deployment keeps what it
      # stored, so raise "position size" there if share entries report that one share is over the limit).
      # Position size must cover at least one share: QQQ costs several hundred dollars.
      - key: MAX_DAILY_LOSS
        value: "100"
      - key: MAX_POSITION_SIZE
        value: "1000"
      - key: MAX_ORDER_NOTIONAL
        value: "1000"
      - key: MAX_CONTRACTS
        value: "1"
      - key: MAX_SHARES
        value: "50"
      - key: MAX_CONCURRENT_POSITIONS
        value: "2"
      - key: MAX_TRADES_PER_DAY
        value: "6"

databases:
  - name: scalp-city-db
    databaseName: scalp_city
    user: scalp
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: [] # no outside access; only the web service connects
